<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbelTools - Home</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

nav {
  background: #1a1a1a;
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

nav h1 {
  color: #fff;
  font-size: 20px;
  margin-right: 40px;
}

nav a {
  color: #ccc;
  text-decoration: none;
  font-size: 15px;
  padding: 0 18px;
  line-height: 56px;
  transition: .2s;
}

nav a:hover {
  color: #fff;
  background: #333;
}

.banner {
  width: 100%;
  height: 240px;
  background: #e8e8e8 url('banner.png') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 48px 24px;
  flex: 1;
}

#content {
  font-size: 16px;
  line-height: 1.8;
  color: #333;
}

#content p {
  margin-bottom: 16px;
}

footer {
  background: #d3d3d3;
  color: #555;
  text-align: center;
  padding: 24px 16px;
  font-size: 14px;
}
</style>
</head>
<body>

<nav>
  <h1>AbelTools</h1>
  <a href="mer.html">MER</a>
  <a href="sgbd.html">SGBD</a>
</nav>

<div class="banner"></div>

<div class="container">
  <div id="content">Carregando...</div>
</div>

<footer id="footer">Carregando...</footer>

<script>
fetch('home.txt')
  .then(r => r.text())
  .then(text => {
    const corpo = text.match(/#CORPO\n([\s\S]*?)(?=\n#RODAPÉ|$)/);
    const rodape = text.match(/#RODAPÉ\n([\s\S]*)/);

    if (corpo) {
      document.getElementById('content').innerHTML =
        corpo[1].trim().split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');
    }

    if (rodape) {
      document.getElementById('footer').innerHTML =
        rodape[1].trim().split('\n').filter(Boolean).join('<br>');
    }
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<p>Bem-vindo ao AbelTools</p>';
    document.getElementById('footer').textContent = 'AbelTools';
  });
</script>

</body>
</html>
