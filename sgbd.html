<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>SQLite Web Manager</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>

<style>

:root{

  --bg:        #0d1117;
  --surface:   #161b22;
  --surface-2: #1f2630;
  --border:    #2d333b;

  --accent:    #6c5ce7;
  --accent-2:  #00cec9;

  --pk:        #fdcb6e;
  --danger:    #ff6b6b;

  --text:      #e6edf3;
  --muted:     #8b949e;

}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  height:100vh;
  display:flex;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* ===== SIDEBAR ===== */

#sidebar{
  width:300px;
  min-width:300px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#sidebar header{
  padding:18px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,var(--accent),#4a3fbf);
}

#sidebar header h3{
  margin:0;
  font-size:15px;
  letter-spacing:.5px;
  color:#fff;
}

#sidebar header .logo{
  width:34px;
  height:34px;
  border-radius:9px;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

#tree{
  flex:1;
  overflow:auto;
  padding:12px;
}

/* árvore */

.tree ul{
  list-style:none;
  padding-left:16px;
  margin:2px 0;
  border-left:1px dashed var(--border);
}

.tree li{
  margin:2px 0;
  font-size:13px;
}

.tree .db,
.tree .table,
.tree .column{
  padding:5px 8px;
  border-radius:6px;
  transition:background .15s;
}

.tree .db:hover,
.tree .table:hover,
.tree .column:hover{
  background:var(--surface-2);
}

/* itens */

.db{
  font-weight:bold;
  color:var(--accent-2);
  font-size:14px;
  background:rgba(0,206,201,.07);
  border:1px solid rgba(0,206,201,.15);
}

.table{
  color:#7aa2f7;
  font-weight:bold;
}

.column{
  color:#b8c2cc;
  font-size:12px;
}

.icon{
  margin-right:6px;
  font-size:12px;
}

/* ICONES DE METADADOS */

.pk{
  color:var(--pk);
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

.fk{
  color:#a5a8f5;
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

.notnull{
  color:#ff9f43;
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

.numeric{
  color:var(--accent-2);
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

/* ===== MAIN ===== */

#main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

/* TOOLBAR */

#toolbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .15s;
}

button:hover{
  border-color:var(--accent);
  color:#fff;
}

button.primary{
  background:linear-gradient(135deg,var(--accent),#4a3fbf);
  border-color:transparent;
  color:#fff;
  box-shadow:0 2px 8px rgba(108,92,231,.35);
}

button.primary:hover{
  filter:brightness(1.1);
}

button.success{
  background:linear-gradient(135deg,#00b894,#00a381);
  border-color:transparent;
  color:#fff;
}

button.success:hover{
  filter:brightness(1.1);
}

/* EDITOR */

.CodeMirror{
  height:220px;
  background:var(--bg) !important;
  color:var(--text) !important;
  border-bottom:1px solid var(--border);
  font-family:Consolas,Menlo,monospace;
  font-size:13.5px;
}

.CodeMirror-gutters{
  background:var(--surface) !important;
  border-right:1px solid var(--border) !important;
}

.CodeMirror-linenumber{
  color:#484f58 !important;
}

.CodeMirror-cursor{
  border-left:1px solid var(--accent) !important;
}

.CodeMirror-selected{
  background:rgba(108,92,231,.25) !important;
}

/* RESULT GRID */

#result{
  flex:1;
  overflow:auto;
  padding:14px;
  background:var(--bg);
}

table{
  border-collapse:collapse;
  width:100%;
  font-size:13px;
  background:var(--surface);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}

th{
  background:var(--surface-2);
  color:var(--accent-2);
  padding:10px 12px;
  text-align:left;
  font-weight:700;
  letter-spacing:.4px;
  text-transform:uppercase;
  font-size:12px;
  position:sticky;
  top:0;
  border-bottom:1px solid var(--border);
}

td{
  padding:8px 12px;
  border-bottom:1px solid var(--border);
}

tr:last-child td{
  border-bottom:none;
}

tr:nth-child(even){
  background:var(--surface-2);
}

tr:hover{
  background:rgba(108,92,231,.12);
}

td.number{
  text-align:right;
  color:var(--accent-2);
  font-weight:bold;
}

td.text{
  text-align:left;
}

td.null{
  color:var(--muted);
  font-style:italic;
}

/* MENSAGEM SEM RESULTADO */

#result .empty{
  color:var(--muted);
  text-align:center;
  padding:40px 0;
  font-size:14px;
}

#result pre{
  color:var(--danger);
  background:rgba(255,107,107,.08);
  border:1px solid rgba(255,107,107,.25);
  border-radius:8px;
  padding:12px;
  white-space:pre-wrap;
}

/* MODAL */

#modal{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

#modalContent{
  background:var(--surface);
  padding:24px;
  border-radius:14px;
  width:320px;
  border:1px solid var(--border);
  border-top:4px solid var(--accent);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

#modalContent h3{
  margin:0 0 14px;
  color:var(--text);
  font-size:17px;
}

#modalContent input{
  width:100%;
  padding:10px 12px;
  margin:8px 0 16px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

#modalContent input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(108,92,231,.2);
}

</style>

</head>

<body>

<div id="sidebar">

  <header>
    <span class="logo">🗄</span>
    <h3>Bancos de Dados</h3>
  </header>

  <div id="tree" class="tree"></div>

</div>

<div id="main">

  <div id="toolbar">

    <button class="primary" onclick="abrirModal()">＋ Novo Banco</button>
    <button onclick="abrirBanco()">📂 Abrir</button>
    <button onclick="salvarBanco()">💾 Salvar</button>
    <button class="success" onclick="executarSQL()">▶ Executar</button>

    <input type="file" id="fileInput" style="display:none"/>

  </div>

  <textarea id="editor"></textarea>

  <div id="result"></div>

</div>

<div id="modal">

  <div id="modalContent">

    <h3>Novo Banco</h3>

    <input id="dbName" placeholder="nome do banco">

    <button class="primary" onclick="criarBanco()">Criar</button>
    <button onclick="fecharModal()">Cancelar</button>

  </div>

</div>

<script>

let SQL
let db
let editor

async function iniciar(){

SQL = await initSqlJs({
locateFile:file=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/"+file
})

db = new SQL.Database()

editor = CodeMirror.fromTextArea(
document.getElementById("editor"),
{
mode:"text/x-sql",
lineNumbers:true
})

atualizarArvore()

}

/* MODAL */

function abrirModal(){
document.getElementById("modal").style.display="flex"
}

function fecharModal(){
document.getElementById("modal").style.display="none"
}

/* CRIAR BANCO */

function criarBanco(){

let nome=document.getElementById("dbName").value

if(!nome)return

db.run("ATTACH DATABASE '"+nome+".db' AS "+nome)

fecharModal()

atualizarArvore()

}

/* EXECUTAR SQL */

function executarSQL(){

let sql=editor.getValue()

try{

let res=db.exec(sql)

mostrarResultado(res)

atualizarArvore()

}catch(e){

document.getElementById("result").innerHTML="<pre style='color:red'>"+e+"</pre>"

}

}

/* RESULTADO */

function mostrarResultado(res){

if(!res.length){

document.getElementById("result").innerHTML="<div class='empty'>Sem resultado</div>"
return

}

let cols=res[0].columns
let rows=res[0].values

let html="<table><tr>"

cols.forEach(c=>html+="<th>"+c+"</th>")

html+="</tr>"

rows.forEach(r=>{

html+="<tr>"

r.forEach(v=>{

let cls="text"

if(v===null)cls="null"
else if(typeof v==="number")cls="number"

html+="<td class='"+cls+"'>"+(v??"NULL")+"</td>"

})

html+="</tr>"

})

html+="</table>"

document.getElementById("result").innerHTML=html

}

/* ÁRVORE */

function atualizarArvore(){

let html="<ul>"

let dbs=db.exec("PRAGMA database_list")

dbs[0].values.forEach(d=>{

let nome=d[1]

html+="<li class='db'><span class='icon'>🗄</span>"+nome

let tables=db.exec("SELECT name FROM "+nome+".sqlite_master WHERE type='table'")

if(tables.length){

html+="<ul>"

tables[0].values.forEach(t=>{

let table=t[0]

html+="<li class='table'><span class='icon'>📋</span>"+table

let cols=db.exec("PRAGMA "+nome+".table_info("+table+")")

let fkList=db.exec("PRAGMA "+nome+".foreign_key_list("+table+")")

if(cols.length){

html+="<ul>"

cols[0].values.forEach(c=>{

let icons=""

/* PRIMARY KEY */

if(c[5]==1)
icons+="<span class='pk' title='Primary Key'>🔑</span>"

/* NOT NULL */

if(c[3]==1)
icons+="<span class='notnull' title='NOT NULL'>⚠️</span>"

/* NUMERIC */

let type=c[2].toUpperCase()

if(type.includes("INT")||type.includes("REAL")||type.includes("NUM"))
icons+="<span class='numeric' title='Numeric Field'>🔢</span>"

/* FOREIGN KEY */

if(fkList.length){

fkList[0].values.forEach(f=>{

if(f[3]==c[1])
icons+="<span class='fk' title='Foreign Key'>🔑</span>"

})

}

html+="<li class='column'><span class='icon'>📄</span>"+c[1]+" ("+c[2]+") "+icons+"</li>"

})

html+="</ul>"

}

html+="</li>"

})

html+="</ul>"

}

html+="</li>"

})

html+="</ul>"

document.getElementById("tree").innerHTML=html

}

/* SALVAR */

function salvarBanco(){

let data=db.export()

let blob=new Blob([data])

let url=URL.createObjectURL(blob)

let a=document.createElement("a")

a.href=url
a.download="database.db"

a.click()

}

/* ABRIR */

function abrirBanco(){

document.getElementById("fileInput").click()

}

document.getElementById("fileInput")
.addEventListener("change",function(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let arr=new Uint8Array(reader.result)

db=new SQL.Database(arr)

atualizarArvore()

}

reader.readAsArrayBuffer(file)

})

iniciar()

</script>

</body>
</html>
