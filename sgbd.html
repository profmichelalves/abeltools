<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SQLite Web Manager</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>

<style>

:root{

  --bg:        #0d1117;
  --surface:   #161b22;
  --surface-2: #1f2630;
  --border:    #2d333b;

  --accent:    #6c5ce7;
  --accent-2:  #00cec9;

  --pk:        #fdcb6e;
  --danger:    #ff6b6b;

  --text:      #e6edf3;
  --muted:     #8b949e;

}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  height:100vh;
  height:100dvh;
  display:flex;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* ===== SIDEBAR ===== */

#sidebar{
  flex:0 0 300px;
  width:300px;
  min-width:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#sidebar header{
  padding:18px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,var(--accent),#4a3fbf);
}

#sidebar header h3{
  margin:0;
  font-size:15px;
  letter-spacing:.5px;
  color:#fff;
}

#sidebar header .logo{
  width:34px;
  height:34px;
  border-radius:9px;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

#tree{
  flex:1;
  overflow:auto;
  padding:12px;
}

/* árvore */

.tree ul{
  list-style:none;
  padding-left:16px;
  margin:2px 0;
  border-left:1px dashed var(--border);
}

.tree li{
  margin:2px 0;
  font-size:13px;
}

.tree .db,
.tree .table,
.tree .column{
  padding:5px 8px;
  border-radius:6px;
  transition:background .15s;
}

.tree .db:hover,
.tree .table:hover,
.tree .column:hover{
  background:var(--surface-2);
}

/* itens */

.db{
  font-weight:bold;
  color:var(--accent-2);
  font-size:14px;
  background:rgba(0,206,201,.07);
  border:1px solid rgba(0,206,201,.15);
}

.table{
  color:#7aa2f7;
  font-weight:bold;
}

.column{
  color:#b8c2cc;
  font-size:12px;
}

.icon{
  margin-right:6px;
  font-size:12px;
}

/* ICONES DE METADADOS */

.pk{
  color:var(--pk);
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

.fk{
  color:#a5a8f5;
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

.notnull{
  color:#ff9f43;
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

.numeric{
  color:var(--accent-2);
  font-size:13px;
  margin-left:4px;
  cursor:help;
}

/* ===== MAIN ===== */

#main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

/* TOOLBAR */

#toolbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .15s;
}

button:hover{
  border-color:var(--accent);
  color:#fff;
}

button.primary{
  background:linear-gradient(135deg,var(--accent),#4a3fbf);
  border-color:transparent;
  color:#fff;
  box-shadow:0 2px 8px rgba(108,92,231,.35);
}

button.primary:hover{
  filter:brightness(1.1);
}

button.success{
  background:linear-gradient(135deg,#00b894,#00a381);
  border-color:transparent;
  color:#fff;
}

button.success:hover{
  filter:brightness(1.1);
}

#toolbar select{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 10px;
  border-radius:8px;
  font-size:13px;
  outline:none;
  cursor:pointer;
  max-width:180px;
}

#toolbar select:focus{
  border-color:var(--accent);
}

/* ===== RÓTULOS DE ÁREA ===== */

.area-label{

  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  padding:4px 8px;
  margin:0;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:4px;
  user-select:none;
  pointer-events:none;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
}

#sidebar .area-label{
  align-self:flex-start;
  margin-bottom:10px;
}

#main > .area-label{
  margin:8px 14px 4px;
}

#resultLabel{
  flex:0 0 auto;
  background:var(--bg);
}

#resultLabel .area-label{
  margin:6px 14px 10px;
}

#editorWrap{
  flex:1 1 0;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
}

#editorZoom{
  position:absolute;
  top:6px;
  right:10px;
  z-index:10;
  display:flex;
  align-items:center;
  gap:4px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:2px;
}

#editorZoom button{
  width:26px;
  height:26px;
  padding:0;
  font-size:14px;
  border-radius:6px;
}

#editorZoom span{
  min-width:42px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}

/* EDITOR */

.CodeMirror{
  flex:1 1 0;
  min-height:80px;
  border-bottom:none;
  background:var(--bg) !important;
  color:var(--text) !important;
  font-family:Consolas,Menlo,monospace;
}

.CodeMirror-gutters{
  background:var(--surface) !important;
  border-right:1px solid var(--border) !important;
}

.CodeMirror-linenumber{
  color:#484f58 !important;
}

.CodeMirror-cursor{
  border-left:1px solid var(--accent) !important;
}

.CodeMirror-selected{
  background:rgba(108,92,231,.25) !important;
}

/* RESULT GRID */

#result{
  flex:0 0 40vh;
  min-height:80px;
  overflow:auto;
  padding:14px;
  background:var(--bg);
}

table{
  border-collapse:collapse;
  width:100%;
  font-size:13px;
  background:var(--surface);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}

th{
  background:var(--surface-2);
  color:var(--accent-2);
  padding:10px 12px;
  text-align:left;
  font-weight:700;
  letter-spacing:.4px;
  text-transform:uppercase;
  font-size:12px;
  position:sticky;
  top:0;
  border-bottom:1px solid var(--border);
}

td{
  padding:8px 12px;
  border-bottom:1px solid var(--border);
}

tr:last-child td{
  border-bottom:none;
}

tr:nth-child(even){
  background:var(--surface-2);
}

tr:hover{
  background:rgba(108,92,231,.12);
}

td.number{
  text-align:right;
  color:var(--accent-2);
  font-weight:bold;
}

td.text{
  text-align:left;
}

td.null{
  color:var(--muted);
  font-style:italic;
}

/* MENSAGEM SEM RESULTADO */

#result .empty{
  color:var(--muted);
  text-align:center;
  padding:40px 0;
  font-size:14px;
}

#result pre{
  color:var(--danger);
  background:rgba(255,107,107,.08);
  border:1px solid rgba(255,107,107,.25);
  border-radius:8px;
  padding:12px;
  white-space:pre-wrap;
}

/* MODAL */

#modal{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

#modalContent{
  background:var(--surface);
  padding:24px;
  border-radius:14px;
  width:320px;
  border:1px solid var(--border);
  border-top:4px solid var(--accent);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

#modalContent h3{
  margin:0 0 14px;
  color:var(--text);
  font-size:17px;
}

#modalContent input{
  width:100%;
  padding:10px 12px;
  margin:8px 0 16px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

#modalContent input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(108,92,231,.2);
}

/* ===== DIVIDERS (REDIMENSIONÁVEIS) ===== */

.splitter-row,
.splitter-col{
  flex:0 0 6px;
  background:var(--border);
  transition:background .15s;
  touch-action:none;
  z-index:5;
}

.splitter-row{
  cursor:row-resize;
}

.splitter-col{
  cursor:col-resize;
}

.splitter-row:hover,
.splitter-col:hover,
.splitter-row.active,
.splitter-col.active{
  background:var(--accent);
}

body.dragging{
  user-select:none;
  -webkit-user-select:none;
}

/* ===== MOBILE ===== */

@media (max-width:768px){

  #toolbar{
    flex-wrap:wrap;
  }

  #sidebar{
    flex:0 0 180px;
    width:180px;
  }
}

</style>

</head>

<body>

<div id="sidebar">

  <header>
    <span class="logo">🗄</span>
    <h3>Bancos de Dados</h3>
  </header>

  <div id="tree" class="tree"></div>

</div>

<div
  class="splitter-col"
  id="splitterSidebar"
  title="Arraste para redimensionar"
></div>

<div id="main">

  <div id="toolbar">

    <span class="area-label">Ferramentas</span>

    <button class="primary" onclick="abrirModal()">＋ Novo Banco</button>
    <button onclick="abrirBanco()">📂 Abrir</button>
    <button onclick="salvarBanco()">💾 Salvar</button>
    <select id="dbSelect" onchange="mudarBanco()" title="Banco ativo"></select>
    <button class="success" onclick="executarSQL()">▶ Executar</button>

    <input type="file" id="fileInput" style="display:none"/>

  </div>

  <div id="editorWrap">

    <span class="area-label">Editor</span>

    <textarea id="editor"></textarea>

    <div id="editorZoom">
      <button onclick="editorZoomOut()" title="Reduzir zoom">−</button>
      <span id="editorZoomLabel">13px</span>
      <button onclick="editorZoomIn()" title="Ampliar zoom">+</button>
    </div>

  </div>

  <div
    class="splitter-row"
    id="splitterEditor"
    title="Arraste para redimensionar"
  ></div>

  <div id="resultLabel">
    <span class="area-label">Resultado</span>
  </div>

  <div id="result"></div>

</div>

<div id="modal">

  <div id="modalContent">

    <h3>Novo Banco</h3>

    <input id="dbName" placeholder="nome do banco">

    <button class="primary" onclick="criarBanco()">Criar</button>
    <button onclick="fecharModal()">Cancelar</button>

  </div>

</div>

<script>

let SQL
let dbs = {}
let ativo = "main"
let editor
let editorFontSize = 13

function editorZoomIn(){
  editorFontSize += 1;
  if(editorFontSize > 28)
    editorFontSize = 28;
  applyEditorZoom();
}

function editorZoomOut(){
  editorFontSize -= 1;
  if(editorFontSize < 7)
    editorFontSize = 7;
  applyEditorZoom();
}

function applyEditorZoom(){
  if(!editor)
    return;
  editor.getWrapperElement().style.fontSize = editorFontSize + "px";
  document.getElementById("editorZoomLabel").textContent = editorFontSize + "px";
  editor.refresh();
}

let pinchStartDist = 0;
let pinchStartSize = 13;
let pinchActive = false;

function getEditorPinchDist(e){

  if(e.touches.length < 2)
    return 0;

  const dx =
    e.touches[0].clientX -
    e.touches[1].clientX;

  const dy =
    e.touches[0].clientY -
    e.touches[1].clientY;

  return Math.sqrt(dx*dx + dy*dy);
}

function initEditorPinch(){

  if(!editor)
    return;

  const wrap =
    editor.getWrapperElement();

  wrap.addEventListener("touchstart", e=>{

    if(e.touches.length === 2){

      pinchActive = true;

      pinchStartDist =
        getEditorPinchDist(e);

      pinchStartSize = editorFontSize;
    }

  }, {passive:false});

  wrap.addEventListener("touchmove", e=>{

    if(!pinchActive)
      return;

    e.preventDefault();

    const dist =
      getEditorPinchDist(e);

    if(dist === 0)
      return;

    editorFontSize = Math.max(
      7,
      Math.min(
        28,
        Math.round(
          pinchStartSize * dist / pinchStartDist
        )
      )
    );

    applyEditorZoom();
  }, {passive:false});

  wrap.addEventListener("touchend", e=>{

    if(e.touches.length < 2)
      pinchActive = false;
  });

  wrap.addEventListener("touchcancel", ()=>{
    pinchActive = false;
  });
}

async function iniciar(){

SQL = await initSqlJs({
locateFile:file=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/"+file
})

dbs["main"] = new SQL.Database()

editor = CodeMirror.fromTextArea(
document.getElementById("editor"),
{
mode:"text/x-sql",
lineNumbers:true
})

initEditorPinch()

atualizarSelect()

atualizarArvore()

}

/* MODAL */

function abrirModal(){
document.getElementById("modal").style.display="flex"
}

function fecharModal(){
document.getElementById("modal").style.display="none"
}

/* CRIAR BANCO */

function criarBanco(){

let nome=document.getElementById("dbName").value.trim()

if(!nome)return

if(dbs[nome]){

alert("Já existe um banco chamado '"+nome+"'")

return

}

dbs[nome]=new SQL.Database()

ativo=nome

document.getElementById("dbName").value=""

fecharModal()

atualizarSelect()

atualizarArvore()

}

/* BANCO ATIVO */

function atualizarSelect(){

let sel=document.getElementById("dbSelect")

sel.innerHTML=""

Object.keys(dbs).forEach(nome=>{

let opt=document.createElement("option")

opt.value=nome
opt.textContent="🗄 "+nome

if(nome===ativo)opt.selected=true

sel.appendChild(opt)

})

}

function mudarBanco(){

ativo=document.getElementById("dbSelect").value

document.getElementById("result").innerHTML=""

}

/* EXECUTAR SQL */

function executarSQL(){

let sql=editor.getValue()

try{

let res=dbs[ativo].exec(sql)

mostrarResultado(res)

atualizarArvore()

}catch(e){

document.getElementById("result").innerHTML="<pre style='color:red'>"+e+"</pre>"

}

}

/* RESULTADO */

function mostrarResultado(res){

if(!res.length){

document.getElementById("result").innerHTML="<div class='empty'>Sem resultado</div>"
return

}

let cols=res[0].columns
let rows=res[0].values

let html="<table><tr>"

cols.forEach(c=>html+="<th>"+c+"</th>")

html+="</tr>"

rows.forEach(r=>{

html+="<tr>"

r.forEach(v=>{

let cls="text"

if(v===null)cls="null"
else if(typeof v==="number")cls="number"

html+="<td class='"+cls+"'>"+(v??"NULL")+"</td>"

})

html+="</tr>"

})

html+="</table>"

document.getElementById("result").innerHTML=html

}

/* ÁRVORE */

function atualizarArvore(){

let html="<ul>"

Object.keys(dbs).forEach(nome=>{

html+="<li class='db'><span class='icon'>🗄</span>"+nome

let tabelas=dbs[nome].exec("SELECT name FROM sqlite_master WHERE type='table'")

if(tabelas.length){

html+="<ul>"

tabelas[0].values.forEach(t=>{

let table=t[0]

html+="<li class='table'><span class='icon'>📋</span>"+table

let cols=dbs[nome].exec("PRAGMA table_info("+table+")")

let fkList=dbs[nome].exec("PRAGMA foreign_key_list("+table+")")

if(cols.length){

html+="<ul>"

cols[0].values.forEach(c=>{

let icons=""

/* PRIMARY KEY */

if(c[5]==1)
icons+="<span class='pk' title='Primary Key'>🔑</span>"

/* NOT NULL */

if(c[3]==1)
icons+="<span class='notnull' title='NOT NULL'>⚠️</span>"

/* NUMERIC */

let type=c[2].toUpperCase()

if(type.includes("INT")||type.includes("REAL")||type.includes("NUM"))
icons+="<span class='numeric' title='Numeric Field'>🔢</span>"

/* FOREIGN KEY */

if(fkList.length){

fkList[0].values.forEach(f=>{

if(f[3]==c[1])
icons+="<span class='fk' title='Foreign Key'>🔑</span>"

})

}

html+="<li class='column'><span class='icon'>📄</span>"+c[1]+" ("+c[2]+") "+icons+"</li>"

})

html+="</ul>"

}

html+="</li>"

})

html+="</ul>"

}

html+="</li>"

})

html+="</ul>"

document.getElementById("tree").innerHTML=html

}

/* SALVAR */

function salvarBanco(){

let data=dbs[ativo].export()

let blob=new Blob([data])

let url=URL.createObjectURL(blob)

let a=document.createElement("a")

a.href=url
a.download=ativo+".db"

a.click()

}

/* ABRIR */

function abrirBanco(){

document.getElementById("fileInput").click()

}

document.getElementById("fileInput")
.addEventListener("change",function(e){

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=function(){

let arr=new Uint8Array(reader.result)

let nome=file.name.replace(/\.db$/i,"")

if(dbs[nome])nome+="_"+Date.now()

dbs[nome]=new SQL.Database(arr)

ativo=nome

atualizarSelect()

atualizarArvore()

}

reader.readAsArrayBuffer(file)

})

/* ==========================
   DIVIDERS REDIMENSIONÁVEIS
========================== */

function makeSplitter(bar,resizeEl,axis,getTotal,sign){

let dragging=false
let startPos=0
let startSize=0

function getPos(e){

let t=e.touches?e.touches[0]:e

return axis==="x"
? t.clientX
: t.clientY

}

function start(e){

dragging=true

startPos=getPos(e)

startSize=axis==="x"
? resizeEl.offsetWidth
: resizeEl.offsetHeight

bar.classList.add("active")

document.body.classList.add("dragging")

document.body.style.cursor=axis==="x"
? "col-resize"
: "row-resize"

if(e.touches)
e.preventDefault()

}

function move(e){

if(!dragging)return

const delta=getPos(e)-startPos

let size=sign==="+"
? startSize+delta
: startSize-delta

const MIN=axis==="x"?150:80

const total=getTotal()

size=Math.max(MIN,Math.min(size,total-MIN))

resizeEl.style.flex="0 0 "+size+"px"

if(e.touches)
e.preventDefault()

}

function end(){

dragging=false

bar.classList.remove("active")

document.body.classList.remove("dragging")

document.body.style.cursor=""

if(typeof editor!=="undefined"&&editor)
editor.refresh()

}

bar.addEventListener("mousedown",start)

bar.addEventListener("touchstart",start,{passive:false})

document.addEventListener("mousemove",move)

document.addEventListener("mouseup",end)

document.addEventListener("touchmove",move,{passive:false})

document.addEventListener("touchend",end)

}

/* sidebar ↔ main */

makeSplitter(
document.getElementById("splitterSidebar"),
document.getElementById("sidebar"),
"x",
()=>document.body.clientWidth,
"+"
)

/* editor ↔ resultado */

makeSplitter(
document.getElementById("splitterEditor"),
document.getElementById("result"),
"y",
()=>{

let main=document.getElementById("main")

let toolbar=document.getElementById("toolbar")

let bar=document.getElementById("splitterEditor")

return main.clientHeight-toolbar.offsetHeight-bar.offsetHeight
}

)

iniciar()

</script>

</body>
</html>
